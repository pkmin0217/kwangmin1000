<!DOCTYPE html>
<html lang="en">
<head> 
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8535459304597048"
    crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Diet Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Health Diet Recommendation</h1>
        <button id="theme-toggle" aria-label="Toggle Dark Mode">🌓</button>
    </header>
    <main>
        <form id="diet-form">
            <h2>Your Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="height">Height (cm):</label>
                    <input type="number" id="height" name="height" placeholder="e.g. 175" required min="100" max="250">
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg):</label>
                    <input type="number" id="weight" name="weight" placeholder="e.g. 70" required min="30" max="300">
                </div>
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" placeholder="e.g. 25" required min="10" max="120">
                </div>
            </div>
            <div class="form-group">
                <label for="goal">Health Goal:</label>
                <select id="goal" name="goal">
                    <option value="weight-loss">Weight Loss</option>
                    <option value="muscle-gain">Muscle Gain</option>
                    <option value="maintenance">Maintenance</option>
                </select>
            </div>
            <div class="form-group">
                <label for="diet">Dietary Preference:</label>
                <select id="diet" name="diet">
                    <option value="none">None</option>
                    <option value="vegetarian">Vegetarian</option>
                    <option value="vegan">Vegan</option>
                    <option value="gluten-free">Gluten-Free</option>
                </select>
            </div>
            <button type="submit">Get Recommendation</button>
        </form>
        <section id="recommendation">
            <h2>Your Recommended Diet</h2>
            <div id="diet-plan">
                <!-- Diet plan will be displayed here -->
            </div>
        </section>
        <section id="partnership">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/xykovjoa" method="POST">
                <div class="form-group">
                    <label for="full-name">Name:</label>
                    <input type="text" id="full-name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email-address">Email:</label>
                    <input type="email" id="email-address" name="_replyto" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="Partnership Opportunity" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" placeholder="How can we collaborate?" required rows="5"></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>
        <section id="comments">
            <h2>Comments</h2>
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */

                var d = document, s = d.createElement('script');
                s.src = 'https://dustin100.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
